name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check countersign bench demo tests
      - run: uv run ruff format --check countersign bench demo tests
      - run: uv run pytest -q -m "not acceptance"
      - run: uv run pytest -q -m acceptance
      - run: uv run python -m bench.run --output bench-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: chaos-bench
          path: bench-results.json

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx vite build
